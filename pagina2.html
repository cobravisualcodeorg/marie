<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para ti</title>
<style>
:root{--glow:#b58cff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#02030b;color:#fff;font-family:Georgia,serif}
.photo-bg{position:fixed;inset:0;z-index:0;background:
linear-gradient(rgba(2,3,11,.68),rgba(2,3,11,.68)),
url("./maria.png") center/cover no-repeat;
opacity:.78;filter:saturate(.82) brightness(.82);transform:scale(1.02)}
.space-overlay{position:fixed;inset:0;z-index:1;overflow:hidden;background:
radial-gradient(circle at 50% 45%,rgba(130,75,230,.18),transparent 32%),
radial-gradient(circle at 20% 80%,rgba(30,110,220,.14),transparent 30%)}
.stars,.stars:before,.stars:after{content:"";position:absolute;inset:-50%;
background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),
radial-gradient(1px 1px at 40% 70%,#fff,transparent),
radial-gradient(2px 2px at 70% 20%,#fff,transparent),
radial-gradient(1px 1px at 85% 80%,#fff,transparent),
radial-gradient(1px 1px at 60% 55%,#fff,transparent),
radial-gradient(2px 2px at 10% 90%,#fff,transparent);
background-size:260px 260px;animation:drift 34s linear infinite;opacity:.82}
.stars:before{transform:scale(1.4);animation-duration:55s;opacity:.34}
.stars:after{transform:scale(.7);animation-duration:20s;opacity:.48}
@keyframes drift{to{transform:translate(260px,260px)}}
.content{position:relative;z-index:5;width:min(900px,90vw);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
h1{font-size:clamp(38px,7vw,76px);margin:0 0 18px;text-shadow:0 0 30px var(--glow);letter-spacing:2px}
p{font-size:clamp(19px,3vw,29px);line-height:1.65;margin:8px 0;color:#eee;text-shadow:0 0 15px #5d4c88}
button{margin-top:30px;padding:15px 30px;border:1px solid rgba(255,255,255,.38);border-radius:999px;background:rgba(0,0,0,.24);color:#fff;font-size:17px;backdrop-filter:blur(8px);cursor:pointer;transition:.3s;box-shadow:0 0 25px rgba(150,100,255,.25)}
button:hover{transform:scale(1.07);background:rgba(255,255,255,.12);box-shadow:0 0 45px rgba(170,120,255,.55)}
.poem{max-width:760px;padding:22px 28px;border-radius:22px;background:rgba(0,0,0,.16);backdrop-filter:blur(2px)}
.reveal{animation:reveal 1.5s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{opacity:0;transform:scale(.72) translateY(18px);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.portal{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#fff 0,#d0b5ff 4%,#7039d0 14%,transparent 47%);box-shadow:0 0 60px #9a62ff,0 0 140px #3d8cff;animation:pulse 3s infinite}
@keyframes pulse{50%{transform:scale(1.15);filter:hue-rotate(35deg)}}
.flash{position:fixed;inset:0;background:#fff;z-index:20;pointer-events:none;animation:flash .8s forwards}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.final-photo{position:fixed;inset:0;z-index:2;background:
linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.35)),
url("./maria.png") center/cover no-repeat;opacity:.78;animation:finalReveal 3.5s ease forwards}
@keyframes finalReveal{from{opacity:.28;transform:scale(1.07)}to{opacity:.92;transform:scale(1)}}
.final-content{position:relative;z-index:5;width:min(850px,90vw);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding-bottom:9vh;animation:up 2.5s ease both}
@keyframes up{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:none}}
.final-content p{background:rgba(0,0,0,.32);padding:15px 24px;border-radius:18px}
.small{font:12px Arial,sans-serif;opacity:.55;margin-top:18px}
</style>
</head>
<body>
<div class="photo-bg"></div>
<div class="space-overlay"><div class="stars"></div></div>
<div class="content">
<div class="poem reveal"><h1>Para ti</h1>
<p>Hay personas que llegan sin avisar,<br>y sin darse cuenta dejan una huella imborrable.<br><br>Tú eres una de esas personas.</p></div>
<button onclick="go('pagina3.html')">🌌 Seguir</button>
</div>
<script>
function go(page){
 const f=document.createElement("div");f.className="flash";document.body.appendChild(f);
 burst();setTimeout(()=>location.href=page,650);
}
function burst(){
 for(let i=0;i<120;i++){
  const s=document.createElement("i");
  s.style.cssText="position:fixed;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:white;z-index:30;pointer-events:none";
  const a=Math.random()*Math.PI*2,d=80+Math.random()*800;
  s.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:1},
  {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(${Math.random()*2+1})`,opacity:0}],
  {duration:500+Math.random()*900,easing:"cubic-bezier(.1,.8,.2,1)"});
  document.body.appendChild(s);setTimeout(()=>s.remove(),1500);
 }
}
</script>
</body>
</html>
